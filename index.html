<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat WA Style</title>
  <style>
    body {
      background: #111;
      font-family: sans-serif;
      color: white;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .bubble {
      max-width: 70%;
      padding: 10px 14px;
      margin: 6px;
      border-radius: 16px;
      position: relative;
      word-wrap: break-word;
      display: inline-block;
    }

    .bubble.user {
      align-self: flex-end;
      background-color: #075e54;
      color: white;
    }

    .bubble.bot {
      align-self: flex-start;
      background-color: #2e3b3b;
      color: white;
    }

    .pending-icon {
      display: inline-block;
      vertical-align: middle;
      width: 16px;
      height: 16px;
      margin-left: 6px;
      position: relative;
      top: 2px;
    }

    .chat-input {
      display: flex;
      padding: 10px;
      background: #222;
      border-top: 1px solid #333;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: none;
      background: #333;
      color: white;
      border-radius: 20px;
      outline: none;
    }

    button {
      margin-left: 10px;
      padding: 0 16px;
      border: none;
      border-radius: 20px;
      background: #075e54;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="chat-container" id="chat"></div>
  <div class="chat-input">
    <input type="text" id="messageInput" placeholder="Tulis pesan..." />
    <button onclick="sendMessage()">Kirim</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('messageInput');
    const webhook = "https://discord.com/api/webhooks/1305239303458258985/TdpYgj-teiUwNg1ZYVepvXKK-5nZ7ZyYPjdMUJ9sI8-PP5T9eRdai4laEkQpAtiZyYwE";
    let lastReply = "";
    let pollInterval = null;

    function addBubble(text, sender = 'user', pending = false) {
      const div = document.createElement('div');
      div.className = `bubble ${sender}`;
      div.textContent = text;

      if (sender === 'user' && pending) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("class", "pending-icon");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.innerHTML = `<path fill="white" d="M12,20A8,8 0 1,0 4,12A8,8 0 0,0 12,20M12,2A10,10 0 1,1 2,12A10,10 0 0,1 12,2M12.5,7H11V13L16.25,16.15L17,14.92L12.5,12.25V7Z"/>`;
        div.appendChild(svg);
        div.classList.add('pending');
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      saveMessages();
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addBubble(text, 'user', true);
      input.value = "";

      // Kirim ke webhook
      fetch(webhook, {
        method: "POST",
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          content: `<@691148414641111121> @gtpshax @everyone @here\n${text}`
        })
      });

      if (!pollInterval) {
        pollInterval = setInterval(fetchReply, 1000);
      }
    }

    function fetchReply() {
      fetch(`https://pastebin.com/raw/pYqAdZrB?cacheBust=${Math.random()}`)
        .then(res => res.text())
        .then(txt => {
          const reply = txt.trim();
          if (reply && reply !== lastReply) {
            lastReply = reply;
            addBubble(reply, 'bot');
            removePending();
          }
        })
        .catch(() => {});
    }

    function removePending() {
      const pendingBubbles = document.querySelectorAll('.bubble.pending');
      if (pendingBubbles.length > 0) {
        const last = pendingBubbles[pendingBubbles.length - 1];
        last.classList.remove('pending');
        const icon = last.querySelector('.pending-icon');
        if (icon) icon.remove();
      }
    }

    function saveMessages() {
      const messages = [];
      chat.querySelectorAll('.bubble').forEach(b => {
        messages.push({
          text: b.childNodes[0].textContent,
          sender: b.classList.contains('user') ? 'user' : 'bot',
          pending: b.classList.contains('pending')
        });
      });
      localStorage.setItem("messages", JSON.stringify(messages));
    }

    function loadMessages() {
      const saved = JSON.parse(localStorage.getItem("messages") || "[]");
      saved.forEach(msg => {
        addBubble(msg.text, msg.sender, msg.pending);
      });
    }

    loadMessages();
  </script>
</body>
</html>
