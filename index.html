<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat Discord Style WhatsApp</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #111b21;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .bubble {
      max-width: 70%;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      word-wrap: break-word;
    }

    .left {
      align-self: flex-start;
      background-color: #202c33;
      border-bottom-left-radius: 0;
    }

    .right {
      align-self: flex-end;
      background-color: #005c4b;
      border-bottom-right-radius: 0;
    }

    #inputArea {
      display: flex;
      padding: 0.75rem;
      background-color: #1e2a30;
      gap: 0.5rem;
    }

    textarea {
      flex: 1;
      resize: none;
      background-color: #2c3b40;
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.5rem;
      font-size: 1rem;
      height: 60px;
    }

    button {
      background-color: #25d366;
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0 1rem;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background-color: #1ea955;
    }
  </style>
</head>
<body>

  <div id="chat"></div>

  <div id="inputArea">
    <textarea id="messageInput" placeholder="Tulis pesan..."></textarea>
    <button onclick="kirimManual()">Kirim</button>
  </div>

  <script>
    const webhookUrl = "https://discord.com/api/webhooks/1305239303458258985/TdpYgj-teiUwNg1ZYVepvXKK-5nZ7ZyYPjdMUJ9sI8-PP5T9eRdai4laEkQpAtiZyYwE";
    const mention = "<@691148414641111121> @everyone @here";
    let lastPaste = "";

    // Tambah bubble ke chat
    function tambahBubble(teks, sisi = "left") {
      const chat = document.getElementById("chat");
      const bubble = document.createElement("div");
      bubble.className = `bubble ${sisi}`;
      bubble.textContent = teks;
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;
    }

    // Kirim manual dari textarea
    async function kirimManual() {
      const isi = document.getElementById("messageInput").value.trim();
      if (!isi) return;

      const konten = `${mention}\n${isi}`;
      tambahBubble(isi, "right");
      document.getElementById("messageInput").value = "";

      try {
        await fetch(webhookUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: konten })
        });
      } catch (e) {
        console.error("Gagal kirim manual:", e);
      }
    }

    // Ambil dari Pastebin setiap 1 detik
    async function fetchPaste() {
      try {
        const res = await fetch("https://pastebin.com/raw/pYqAdZrB");
        const teks = await res.text();
        const clean = teks.trim();

        if (clean && clean !== lastPaste) {
          lastPaste = clean;
          tambahBubble(clean, "left");

          await fetch(webhookUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content: `${mention}\n${clean}` })
          });
        }
      } catch (e) {
        console.error("Gagal fetch dari Pastebin:", e);
      }
    }

    setInterval(fetchPaste, 1000);
  </script>

</body>
</html>
