<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat WhatsApp Style</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #111b21;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .bubble {
      max-width: 70%;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      word-wrap: break-word;
      position: relative;
    }

    .left {
      align-self: flex-start;
      background-color: #202c33;
      border-bottom-left-radius: 0;
    }

    .right {
      align-self: flex-end;
      background-color: #005c4b;
      border-bottom-right-radius: 0;
    }

    .pending::after {
      content: "⌛";
      position: absolute;
      bottom: 4px;
      right: 10px;
      font-size: 0.9em;
      color: #ccc;
    }

    #inputArea {
      display: flex;
      padding: 0.75rem;
      background-color: #1e2a30;
      gap: 0.5rem;
    }

    textarea {
      flex: 1;
      resize: none;
      background-color: #2c3b40;
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.5rem;
      font-size: 1rem;
      height: 60px;
    }

    button {
      background-color: #25d366;
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0 1rem;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background-color: #1ea955;
    }
  </style>
</head>
<body>

  <div id="chat"></div>

  <div id="inputArea">
    <textarea id="messageInput" placeholder="Tulis pesan..."></textarea>
    <button onclick="kirimManual()">Kirim</button>
  </div>

  <script>
    const webhookUrl = "https://discord.com/api/webhooks/1305239303458258985/TdpYgj-teiUwNg1ZYVepvXKK-5nZ7ZyYPjdMUJ9sI8-PP5T9eRdai4laEkQpAtiZyYwE";
    const mention = "<@691148414641111121> @everyone @here";
    let lastText = "";
    let fetchStarted = false;

    // Load dari localStorage
    const chat = document.getElementById("chat");
    let chatData = JSON.parse(localStorage.getItem("chatData")) || [];

    function renderChat() {
      chat.innerHTML = "";
      chatData.forEach(item => {
        tambahBubble(item.text, item.side, item.pending);
      });
    }

    function tambahBubble(teks, sisi = "left", pending = false) {
      const bubble = document.createElement("div");
      bubble.className = `bubble ${sisi}`;
      if (pending) bubble.classList.add("pending");
      bubble.textContent = teks;
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;
    }

    function simpanKeStorage(text, side, pending = false) {
      chatData.push({ text, side, pending });
      localStorage.setItem("chatData", JSON.stringify(chatData));
    }

    async function kirimManual() {
      const isi = document.getElementById("messageInput").value.trim();
      if (!isi) return;

      tambahBubble(isi, "right", true);
      simpanKeStorage(isi, "right", true);
      document.getElementById("messageInput").value = "";

      try {
        await fetch(webhookUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: `${mention}\n${isi}` })
        });

        if (!fetchStarted) {
          fetchStarted = true;
          setInterval(fetchPastebin, 1000);
        }
      } catch (e) {
        console.error("Gagal kirim:", e);
      }
    }

    async function fetchPastebin() {
      try {
        const pasteUrl = "https://pastebin.com/raw/pYqAdZrB?t=" + Date.now();
        const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(pasteUrl);
        const res = await fetch(proxyUrl);
        const teks = await res.text();
        const clean = teks.trim();

        if (clean && clean !== lastText) {
          lastText = clean;

          // Update bubble terakhir yg pending
          for (let i = chatData.length - 1; i >= 0; i--) {
            if (chatData[i].side === "right" && chatData[i].pending) {
              chatData[i].pending = false;
              break;
            }
          }

          simpanKeStorage(clean, "left");
          localStorage.setItem("chatData", JSON.stringify(chatData));
          renderChat();
        }
      } catch (e) {
        console.error("Gagal fetch pastebin:", e);
      }
    }

    renderChat();
  </script>

</body>
</html>
